<!-- ============================================================
     صفحة التسجيل - منصة الجند التعليمية
     (هذا الملف يُحقن داخل <main id="app"> في القالب)
     ============================================================ -->

<section class="page-section">
  <div class="register-card">

    <div class="card-header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <h1>تسجيل طالب جديد</h1>
      <p class="subtitle">أدخل بياناتك، وسيتم إرسالها للمشرف لتوليد كود الدخول</p>
    </div>

    <form id="registerForm" novalidate>

      <div class="form-group">
        <label for="studentName">
          <span class="label-text">الاسم الكامل</span>
          <span class="required-badge">مطلوب</span>
        </label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input id="studentName" name="studentName" type="text" placeholder="مثال: أحمد محمد علي" required>
        </div>
        <span class="error-msg" id="nameError"></span>
      </div>

      <div class="form-group">
        <label for="studentId">
          <span class="label-text">الرقم الجامعي</span>
          <span class="optional-badge">اختياري</span>
        </label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M7 9h10M7 13h6"/>
          </svg>
          <input id="studentId" name="studentId" type="text" placeholder="مثال: 2024001">
        </div>
        <span class="error-msg" id="idError"></span>
      </div>

      <div class="form-group">
        <label for="studentPhone">
          <span class="label-text">رقم الهاتف (واتساب)</span>
          <span class="required-badge">مطلوب</span>
        </label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <input id="studentPhone" name="studentPhone" type="tel" placeholder="مثال: 777000000" required>
        </div>
        <span class="error-msg" id="phoneError"></span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="college">
            <span class="label-text">الكلية</span>
            <span class="required-badge">مطلوب</span>
          </label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/>
              <path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/>
            </svg>
            <select id="college" name="college" required>
              <option value="">اختر الكلية</option>
              <option value="ENG">كلية الهندسة وتقنية المعلومات</option>
            </select>
          </div>
          <span class="error-msg" id="collegeError"></span>
        </div>

        <div class="form-group">
          <label for="department">
            <span class="label-text">القسم</span>
            <span class="required-badge">مطلوب</span>
          </label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
            <select id="department" name="department" required>
              <option value="">اختر القسم</option>
              <option value="ARCH">قسم الهندسة المعمارية</option>
              <option value="CIVIL">قسم التصميم الداخلي</option>
            </select>
          </div>
          <span class="error-msg" id="deptError"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="level">
          <span class="label-text">المستوى الدراسي</span>
          <span class="required-badge">مطلوب</span>
        </label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
          <select id="level" name="level" required>
            <option value="">اختر المستوى</option>
            <option value="1">المستوى الأول</option>
            <option value="2">المستوى الثاني</option>
            <option value="3">المستوى الثالث</option>
            <option value="4">المستوى الرابع</option>
          </select>
        </div>
        <span class="error-msg" id="levelError"></span>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
          إرسال الطلب عبر واتساب
        </span>
        <span id="btnLoader" class="loader" style="display:none;"></span>
      </button>

    </form>

    <div id="successBox" class="success-box" style="display:none;">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <path d="M22 4L12 14.01l-3-3"/>
        </svg>
      </div>
      <h3>تم فتح واتساب!</h3>
      <p>اضغط على زر <strong>"إرسال"</strong> في واتساب لإكمال طلبك.</p>
      <p class="note">سيصلك كود الدخول على نفس الرقم بعد مراجعة طلبك.</p>
      <a class="btn-secondary" href="/p/login.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <path d="M10 17l5-5-5-5M15 12H3"/>
        </svg>
        الانتقال لتسجيل الدخول
      </a>
    </div>

    <div class="card-footer">
      <p>لديك كود دخول؟ <a href="/p/login.html">سجّل الدخول</a></p>
    </div>

  </div>
</section>
