<!-- ============================================================
     صفحة تسجيل الدخول - منصة الجند التعليمية
     ============================================================ -->

<section class="page-section">
  <div class="register-card login-card">

    <div class="card-header">
      <div class="header-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1>تسجيل الدخول</h1>
      <p class="subtitle">أدخل رقم هاتفك وكود الدخول للوصول إلى مقرراتك</p>
    </div>

    <form id="loginForm" novalidate>

      <!-- رقم الهاتف -->
      <div class="form-group">
        <label for="studentPhone">
          <span class="label-text">رقم الهاتف (واتساب)</span>
          <span class="required-badge">مطلوب</span>
        </label>
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <input 
            id="studentPhone" 
            name="studentPhone" 
            type="tel" 
            placeholder="مثال: 777000000" 
            required
            autocomplete="tel"
            inputmode="numeric">
        </div>
        <span class="error-msg" id="studentPhoneError"></span>
      </div>

      <!-- كود الدخول -->
      <div class="form-group">
        <label for="accessCode">
          <span class="label-text">كود الدخول</span>
          <span class="required-badge">مطلوب</span>
        </label>
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
          </svg>
          <input 
            id="accessCode" 
            name="accessCode" 
            type="text" 
            placeholder="HA1-XXXXXXXX" 
            required
            autocomplete="off"
            spellcheck="false"
            style="text-align:center; font-family:monospace; letter-spacing:3px; font-size:1.05rem; font-weight:700;">
        </div>
        <span class="error-msg" id="accessCodeError"></span>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText" style="display:inline-flex;align-items:center;gap:10px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <path d="M10 17l5-5-5-5M15 12H3"/>
          </svg>
          دخول
        </span>
        <span id="btnLoader" class="loader" style="display:none;"></span>
      </button>

    </form>

    <div id="successBox" class="success-box" style="display:none;">
      <div class="success-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <path d="M22 4L12 14.01l-3-3"/>
        </svg>
      </div>
      <h3>تم تسجيل دخولك!</h3>
      <p>مرحبًا <strong id="welcomeName"></strong></p>
      <p class="note">جاري تحويلك إلى بوابة الطالب...</p>
    </div>

    <div class="card-footer">
      <p>ليس لديك كود دخول؟ <a href="/p/register.html">سجّل الآن</a></p>
    </div>

  </div>
</section>

<script>
(function() {
  'use strict';

  var form = document.getElementById('loginForm');
  if (!form) return;

  var phoneInput = document.getElementById('studentPhone');
  var codeInput  = document.getElementById('accessCode');

  // تنظيف تلقائي لرقم الهاتف (أرقام فقط)
  phoneInput.addEventListener('input', function(e) {
    e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 12);
    clearError('studentPhone');
  });

  // تحويل تلقائي للكود إلى أحرف كبيرة
  codeInput.addEventListener('input', function(e) {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
    clearError('accessCode');
  });

  function clearError(fieldId) {
    document.getElementById(fieldId + 'Error').textContent = '';
    var el = document.getElementById(fieldId);
    var wrapper = el.closest('.input-wrapper');
    if (wrapper) wrapper.classList.remove('error');
  }

  function setError(fieldId, message) {
    document.getElementById(fieldId + 'Error').textContent = message;
    var el = document.getElementById(fieldId);
    var wrapper = el.closest('.input-wrapper');
    if (wrapper) wrapper.classList.add('error');
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    var phone = phoneInput.value.trim();
    var code  = codeInput.value.trim().toUpperCase();

    // تحقق من الرقم
    var cleanPhone = phone.replace(/^0/, '').replace(/\s+/g, '');
    if (!cleanPhone || !/^[0-9]{9,12}$/.test(cleanPhone)) {
      setError('studentPhone', 'رقم الهاتف غير صحيح (9 إلى 12 رقمًا)');
      return;
    }

    // تحقق من الكود
    if (!code) {
      setError('accessCode', 'أدخل كود الدخول');
      return;
    }

    if (!AlJanadAPI.validateAccessCode(code)) {
      setError('accessCode', 'صيغة الكود غير صحيحة (مثال: HA1-A2B3C4D5)');
      return;
    }

    // بدء الاتصال
    AlJanadAPI.setLoading(true, 'submitBtn', 'btnText', 'btnLoader');

    AlJanadAPI.verifyAccessCode(code, cleanPhone)
      .then(function(result) {
        if (!result.success) {
          throw new Error(result.message || 'بيانات الدخول غير صحيحة');
        }

        AlJanadAPI.saveSession(result.student);

        form.style.display = 'none';
        document.getElementById('successBox').style.display = 'block';
        document.getElementById('welcomeName').textContent = result.student.name;

        setTimeout(function() {
          window.location.href = '/p/portal.html';
        }, 1800);
      })
      .catch(function(err) {
        var msg = err.message || 'تعذر التحقق من بياناتك';

        // توجيه الخطأ للحقل المناسب
        if (msg.indexOf('هاتف') !== -1 || msg.indexOf('رقم') !== -1) {
          setError('studentPhone', msg);
        } else {
          setError('accessCode', msg);
        }

        AlJanadAPI.showToast(msg, 'error', 4000);
      })
      .finally(function() {
        AlJanadAPI.setLoading(false, 'submitBtn', 'btnText', 'btnLoader');
      });
  });

})();
</script>
